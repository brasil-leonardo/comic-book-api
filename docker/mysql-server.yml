services:
  mysql-server:
    container_name: mysql-server
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comicbook
      MYSQL_USER: comicbookuser
      MYSQL_PASSWORD: comicbookpassword

volumes:
  mysql_data: